[project]
name = "odmdm-connector-demo"
version = "1.0.0"
description = "A pretend MDM for odmdm-connector: the starting point for an MDM plugin"
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11,<4.0"
dependencies = [
    "odmdm-connector>=1.1,<2",
]

[project.entry-points."odmdm_connector.mdm"]
demo = "odmdm_connector_demo:DemoMdm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odmdm_connector_demo"]
