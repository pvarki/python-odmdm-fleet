[project]
name = "odmdm-connector"
version = "1.2.0+261121"
description = "Connects an MDM, FleetDM built in, to an OpenDefence deployment's SCEP device enrolment"
authors = [
    { name = "Benjam", email = "benjam@opendefence.fi" },
]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11,<4.0"
dependencies = ["keyring>=25.6,<26.0"]

[project.urls]
homepage = "https://github.com/pvarki/python-odmdm-fleet"
repository = "https://github.com/pvarki/python-odmdm-fleet"

[project.scripts]
odmdm-connector = "odmdm_connector.console:odmdm_connector_cli"

[project.entry-points."odmdm_connector.mdm"]
fleet = "odmdm_connector.fleet_plugin:FleetPlugin"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "coverage>=7.4,<8.0",
    "pytest-cov>=4.1,<5.0",
    "bandit>=1.8,<2.0",
    "mypy>=1.15,<2.0",
    "prek>=0.2,<1.0",
    "bump-my-version>=1.2,<2.0",
    "detect-secrets>=1.5,<2.0",
    "tox>=4.0,<5.0",
    "tox-uv>=1.0,<2.0",
    "ruff>=0.15.12",
]
dist = [
    "pyinstaller>=6.22,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odmdm_connector"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# The connector holds a token that can reach every phone: it starts no process and runs no code
# it was given. S102 and S307 are exec and eval.
extend-select = ["TID251", "S102", "S307"]

[tool.ruff.lint.per-file-ignores]
# The guard that makes those raise during the tests, and its test
"conftest.py" = ["TID251"]
"tests/test_no_processes.py" = ["TID251"]
# The one exception, decided by the owner: the web command opens the page in the default browser.
# The address goes through a file only the user can read, so the key is in no program's arguments.
# Ruff cannot exempt one API, so this lifts every ban here: tests/test_no_processes.py, not ruff,
# holds the rule inside browser.py: six modules, no os process start, of webbrowser open and Error.
"src/odmdm_connector/browser.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "The connector starts no process"
"asyncio.create_subprocess_exec".msg = "The connector starts no process"
"asyncio.create_subprocess_shell".msg = "The connector starts no process"
"multiprocessing".msg = "The connector starts no process"
"pty".msg = "The connector starts no process"
"webbrowser".msg = "Opening a browser starts a process: only browser.py opens the browser"
"os.system".msg = "The connector starts no process"
"os.popen".msg = "The connector starts no process"
"os.fork".msg = "The connector starts no process"
"os.forkpty".msg = "The connector starts no process"
"os.posix_spawn".msg = "The connector starts no process"
"os.posix_spawnp".msg = "The connector starts no process"
"os.startfile".msg = "The connector starts no process"
"os.execl".msg = "The connector starts no process"
"os.execle".msg = "The connector starts no process"
"os.execlp".msg = "The connector starts no process"
"os.execlpe".msg = "The connector starts no process"
"os.execv".msg = "The connector starts no process"
"os.execve".msg = "The connector starts no process"
"os.execvp".msg = "The connector starts no process"
"os.execvpe".msg = "The connector starts no process"
"os.spawnl".msg = "The connector starts no process"
"os.spawnle".msg = "The connector starts no process"
"os.spawnlp".msg = "The connector starts no process"
"os.spawnlpe".msg = "The connector starts no process"
"os.spawnv".msg = "The connector starts no process"
"os.spawnve".msg = "The connector starts no process"
"os.spawnvp".msg = "The connector starts no process"
"os.spawnvpe".msg = "The connector starts no process"
"importlib.import_module".msg = "Only plugins.load imports code, and only the chosen entry point"

[tool.mypy]
strict=true
# The demo plugin's tests import it from its source, as pytest does, and the manifest's test from packaging
mypy_path="examples/odmdm-connector-demo/src:packaging"

# A build tool, in the dist group only, and without type hints
[[tool.mypy.overrides]]
module="PyInstaller.*"
ignore_missing_imports=true

[[tool.mypy.overrides]]
module="tests.*"
disallow_untyped_decorators=false

[tool.pytest.ini_options]
junit_family="xunit2"
# The demo plugin, a package of its own, runs its contract tests here from its source; and packaging/manifest.py
pythonpath=["examples/odmdm-connector-demo/src", "packaging"]
addopts="--cov=odmdm_connector --cov-fail-under=88 --cov-branch"

[tool.coverage.run]
omit = ["tests/*"]
branch = true
