[project]
name = "odmdm-fleet"
version = "0.1.0+261031"
description = "Connects FleetDM to an OpenDefence deployment's SCEP device enrolment"
authors = [
    { name = "Benjam", email = "benjam@opendefence.fi" },
]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11,<4.0"
dependencies = [
    "libadvian>=1.4,<2.0",
    "click>=8.1,<9.0",
    "httpx>=0.28,<1.0",
]

[project.urls]
homepage = "https://github.com/pvarki/python-odmdm-fleet"
repository = "https://github.com/pvarki/python-odmdm-fleet"

[project.scripts]
odmdm-fleet = "odmdm_fleet.console:odmdm_fleet_cli"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "coverage>=7.4,<8.0",
    "pytest-cov>=4.1,<5.0",
    "bandit>=1.8,<2.0",
    "mypy>=1.15,<2.0",
    "prek>=0.2,<1.0",
    "bump-my-version>=1.2,<2.0",
    "detect-secrets>=1.5,<2.0",
    "tox>=4.0,<5.0",
    "tox-uv>=1.0,<2.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odmdm_fleet"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
strict=true

[[tool.mypy.overrides]]
module="tests.*"
disallow_untyped_decorators=false

[tool.pytest.ini_options]
junit_family="xunit2"
addopts="--cov=odmdm_fleet --cov-fail-under=65 --cov-branch"

[tool.coverage.run]
omit = ["tests/*"]
branch = true
