on:
  pull_request:
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  # The library's general-check runs prek without a venv, and the generated python config ends in a
  # local mypy hook that resolves from PATH, so prek runs here after setup-python instead.
  bumpversion-check:
    name: Validate .bumpversion.toml
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pvarki/config-ci-library/.github/actions/validate-bumpversion@fffb737257f6a08b0bbd03aa8f9e090cc610e7b6 # v0.15.0+261104

  pre-commit:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pvarki/config-ci-library/.github/actions/setup-python@fffb737257f6a08b0bbd03aa8f9e090cc610e7b6 # v0.15.0+261104
        with:
          python-version: "3.12"
      - name: Do pre-commit checks
        run: uv run prek run --all-files

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pvarki/config-ci-library/.github/actions/setup-python@fffb737257f6a08b0bbd03aa8f9e090cc610e7b6 # v0.15.0+261104
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test with pytest, coverage floor in pyproject.toml
        run: uv run pytest -v

  snyk-test:
    name: Run Snyk test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pvarki/config-ci-library/.github/actions/setup-python@fffb737257f6a08b0bbd03aa8f9e090cc610e7b6 # v0.15.0+261104
        with:
          python-version: "3.11"
      - uses: pvarki/config-ci-library/.github/actions/snyk-test@fffb737257f6a08b0bbd03aa8f9e090cc610e7b6 # v0.15.0+261104
        with:
          snyk-org: deployapp-core-services
          snyk-token: ${{ secrets.SNYK_TOKEN }}
